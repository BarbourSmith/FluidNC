name: Compile Firmware on User Request

on:
  issue_comment:
    types: [created]

jobs:
  compile-firmware:
    runs-on: ubuntu-latest
    
    # Run only when specific build commands are used in a comment on a PR
    if: |
      github.event.issue.pull_request != null &&
      (contains(github.event.comment.body, 'please build') || contains(github.event.comment.body, '/build') ||
       contains(github.event.comment.body, 'build:split'))
    
    steps:
    - name: Get PR details for issue comment
      id: pr
      run: |
        PR_NUMBER=${{ github.event.issue.number }}
        PR_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}")
        echo "head_sha=$(echo "$PR_DATA" | jq -r .head.sha)" >> $GITHUB_OUTPUT
        
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.pr.outputs.head_sha }}
        fetch-depth: 0  # Fetch all history for proper version reporting
        fetch-tags: true  # Explicitly fetch all tags
      
    - name: Verify tags are available
      run: |
        echo "Available tags:"
        git tag -l | tail -10
        echo "Git describe output:"
        git describe --tags --always
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-platformio-
          
    - name: Cache npm dependencies (embedded)
      uses: actions/cache@v4
      with:
        path: firmware/embedded/node_modules
        key: ${{ runner.os }}-npm-embedded-${{ hashFiles('firmware/embedded/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-embedded-
          
    - name: Cache npm dependencies (ESP3D-WEBUI)
      uses: actions/cache@v4
      with:
        path: ESP3D-WEBUI/node_modules
        key: ${{ runner.os }}-npm-esp3d-${{ hashFiles('ESP3D-WEBUI/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-esp3d-
          
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
        
    - name: Install npm dependencies (embedded)
      run: |
        cd firmware/embedded
        npm install
        
    - name: Build embedded web page
      run: |
        cd firmware/embedded
        python3 build.py
        
    - name: Install npm dependencies (ESP3D-WEBUI)
      run: |
        cd ESP3D-WEBUI
        npm install
        
    - name: Detect build mode
      id: buildmode
      run: |
        if echo "${{ github.event.comment.body }}" | grep -qi 'build:split'; then
          echo "split=true" >> $GITHUB_OUTPUT
        else
          echo "split=false" >> $GITHUB_OUTPUT
        fi

    - name: Build ESP3D-WEBUI
      run: |
        cd ESP3D-WEBUI
        if [ "${{ steps.buildmode.outputs.split }}" = "true" ]; then
          npx gulp package:split --lang en
        else
          npx gulp package --lang en
        fi
        
    - name: Build firmware
      run: |
        cd firmware
        pio run -e wifi_s3 | tee ../build_output.log
        
    - name: Prepare firmware artifact folder
      run: |
        mkdir -p firmware-package

        cp firmware/.pio/build/wifi_s3/firmware.bin firmware-package/

        # Verify ESP3D-WEBUI build output exists before copying
        if [ ! -f ESP3D-WEBUI/dist/index.html.gz ]; then
          echo "Error: ESP3D-WEBUI/dist/index.html.gz not found"
          exit 1
        fi
        cp ESP3D-WEBUI/dist/index.html.gz firmware-package/

        # In split mode, also include the separate app.js.gz
        if [ "${{ steps.buildmode.outputs.split }}" = "true" ]; then
          if [ ! -f ESP3D-WEBUI/dist/app.js.gz ]; then
            echo "Error: ESP3D-WEBUI/dist/app.js.gz not found"
            exit 1
          fi
          cp ESP3D-WEBUI/dist/app.js.gz firmware-package/
          cat > firmware-package/README.txt << 'EOF'
        FluidNC Firmware Package (Split Web UI)
        ========================================

        This package contains the firmware and a split web UI (HTML + JS as separate files).

        Contents:
        - firmware.bin: The main FluidNC firmware for ESP32-S3
        - index.html.gz: The ESP3D web interface HTML + CSS (compressed, no JS)
        - app.js.gz: All web interface JavaScript (compressed)

        Installation Instructions:
        1. Upload firmware.bin to the machine as normal
        2. Upload BOTH index.html.gz AND app.js.gz to the /littlefs filesystem root

        Both web UI files are required. The firmware serves app.js.gz transparently
        when the browser requests app.js.

        This firmware and web UI were automatically compiled from the pull request changes.
        EOF
        else
          cat > firmware-package/README.txt << 'EOF'
        FluidNC Firmware Package
        ========================

        This package contains both the firmware and the web UI.

        Contents:
        - firmware.bin: The main FluidNC firmware for ESP32-S3
        - index.html.gz: The ESP3D web interface (compressed)

        Installation Instructions:
        1. Extract this entire folder to your desired location
        2. Upload firmware.bin to the machine as normal
        3. Upload index.html.gz to the /littlefs partition (if web UI changes were made)

        This firmware and web UI were automatically compiled from the pull request changes.
        EOF
        fi
        
    - name: Upload firmware as artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-package
        path: firmware-package/
        retention-days: 30
        
    - name: Comment on PR with firmware info
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = 'firmware/.pio/build/wifi_s3/firmware.bin';
          const stats = fs.statSync(path);
          const fileSizeInBytes = stats.size;
          const fileSizeInMB = (fileSizeInBytes / (1024*1024)).toFixed(2);
          
          // Get ESP3D-WEBUI size
          const isSplit = '${{ steps.buildmode.outputs.split }}' === 'true';
          let webuiSizeKB = 'N/A';
          let appjsSizeKB = 'N/A';
          try {
            const webuiPath = 'ESP3D-WEBUI/dist/index.html.gz';
            const webuiStats = fs.statSync(webuiPath);
            webuiSizeKB = (webuiStats.size / 1024).toFixed(2);
          } catch (e) {
            console.log('Could not read ESP3D-WEBUI size:', e.message);
          }
          if (isSplit) {
            try {
              const appjsStats = fs.statSync('ESP3D-WEBUI/dist/app.js.gz');
              appjsSizeKB = (appjsStats.size / 1024).toFixed(2);
            } catch (e) {
              console.log('Could not read app.js.gz size:', e.message);
            }
          }
          
          // Extract version number from version.cpp
          let versionNumber = 'unknown';
          try {
            const versionContent = fs.readFileSync('firmware/FluidNC/src/version.cpp', 'utf8');
            const versionMatch = versionContent.match(/const char\* VERSION_NUMBER = "(.+?)";/);
            if (versionMatch) {
              versionNumber = versionMatch[1];
            }
          } catch (e) {
            console.log('Could not read version.cpp:', e.message);
          }
          
          // Parse build output for memory usage
          let flashUsed = 'N/A';
          let flashPercent = 'N/A';
          let ramUsed = 'N/A';
          let ramPercent = 'N/A';
          
          try {
            const buildLog = fs.readFileSync('build_output.log', 'utf8');
            
            // Look for lines like:
            // RAM:   [====      ]  42.3% (used 138524 bytes from 327680 bytes)
            // Flash: [========  ]  78.5% (used 2421973 bytes from 3080192 bytes)
            const ramMatch = buildLog.match(/RAM:\s+\[.*?\]\s+([\d.]+)%\s+\(used\s+([\d]+)\s+bytes\s+from\s+([\d]+)\s+bytes\)/);
            const flashMatch = buildLog.match(/Flash:\s+\[.*?\]\s+([\d.]+)%\s+\(used\s+([\d]+)\s+bytes\s+from\s+([\d]+)\s+bytes\)/);
            
            if (ramMatch) {
              ramPercent = ramMatch[1];
              ramUsed = (parseInt(ramMatch[2]) / 1024).toFixed(1) + ' KB';
            }
            
            if (flashMatch) {
              flashPercent = flashMatch[1];
              flashUsed = (parseInt(flashMatch[2]) / (1024*1024)).toFixed(2) + ' MB';
            }
          } catch (e) {
            console.log('Could not parse build output:', e.message);
          }
          
          // Get PR number and commit SHA from the issue comment event
          const prNumber = context.issue.number;
          // Get the PR details to get the latest commit SHA
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber
          });
          const commitSha = pr.head.sha;
          
          const triggerText = '_This comment was automatically generated in response to a build request comment._';

          const webuiDetails = isSplit
            ? `- Language: English only (split build)\n          - index.html.gz: ${webuiSizeKB} KB (HTML + CSS, no JS)\n          - app.js.gz: ${appjsSizeKB} KB (all JavaScript)\n          - ⚠️ Both files must be uploaded to the ESP32 filesystem`
            : `- Language: English only\n          - WebUI size: ${webuiSizeKB} KB (compressed)\n          - Format: index.html.gz`;

          const artifactContents = isSplit
            ? 'firmware.bin, index.html.gz, app.js.gz, and installation instructions'
            : 'firmware.bin, index.html.gz, and installation instructions';

          const comment = `🤖 **Firmware & Web UI Compilation Complete** 🤖
          
          ✅ Successfully compiled FluidNC firmware and ESP3D-WEBUI
          
          **Firmware Build Details:**
          - Commit: \`${commitSha}\`
          - Version: \`${versionNumber}\`
          - Environment: \`wifi_s3\` (ESP32-S3)
          - Firmware size: ${fileSizeInMB} MB
          - Flash usage: ${flashUsed} (${flashPercent}%)
          - RAM usage: ${ramUsed} (${ramPercent}%)
          
          **Web UI Build Details:**
          ${webuiDetails}
          
          **Download:**
          The firmware package (containing ${artifactContents}) has been uploaded as a build artifact named "firmware-package" and can be downloaded from the [Actions tab](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          
          To test this release please:
          [] Try running calibration with a fresh maslow.yaml file
          [] Test jogging the machine to see that movements are normal
          [] Try running a simple gcode file

          ${triggerText}`;
          
          github.rest.issues.createComment({
            issue_number: prNumber,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
